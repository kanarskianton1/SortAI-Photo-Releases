name: Apple Silicon 3.9.18 distribution build
on:
  push:
    branches: [build-check/macos-arm64-3918]
permissions: {}
concurrency:
  group: sortai-macos-compat-3918
  cancel-in-progress: false
jobs:
  native-relay:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the public relay script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use native arm64 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Verify the build architecture
        shell: bash
        run: |
          python -c 'import platform,sys,tkinter; assert sys.platform == "darwin" and platform.machine() == "arm64"'
          test -x /usr/bin/hdiutil
          command -v gh >/dev/null
      - name: Install the pinned decryption dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Verify encrypted input and build native macOS artifacts
        id: build
        env:
          SORTAI_NATIVE_COMPAT_3918: ${{ secrets.SORTAI_NATIVE_COMPAT_3918 }}
        run: python .github/workflows/macos-3918-relay.py build
      - name: Upload verified deliverables to an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/workflows/macos-3918-relay.py upload
      - name: Preserve only the encrypted native diagnostic
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/workflows/macos-3918-relay.py upload-diagnostic
