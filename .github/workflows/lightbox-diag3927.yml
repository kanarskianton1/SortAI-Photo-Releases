name: Exact-source lightbox event diagnosis on Apple Silicon
on:
  push:
    branches: [build-check/lightbox-diag3927]
permissions: {}
concurrency:
  group: sortai-lightbox-diag3927
  cancel-in-progress: false
jobs:
  lightbox-diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the public diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use the same native arm64 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Verify the diagnostic host
        run: python -c 'import platform,sys,tkinter; assert sys.platform == "darwin" and platform.machine() == "arm64" and platform.mac_ver()[0].startswith("15.")'
      - name: Install the pinned decryption dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Run instrumented exact-source lightbox diagnosis
        id: diag
        env:
          SORTAI_LIGHTBOX_DIAG3927: ${{ secrets.SORTAI_LIGHTBOX_DIAG3927 }}
        run: python .github/qa/lightbox_diag3927_worker.py run
      - name: Preserve only the encrypted diagnostic
        if: ${{ always() && steps.diag.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/qa/lightbox_diag3927_worker.py upload-diagnostic
