name: Apple Silicon .17 to .19 compact native QA

on:
  push:
    branches: [build-check/macos-arm64-3919-qa]

permissions: {}

jobs:
  native-compact-qa:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the compact QA harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use native arm64 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Fetch and verify exact Apple Silicon QA inputs
        env:
          SORTAI_MAC_COMPACT_QA_3919: ${{ secrets.SORTAI_MAC_COMPACT_QA_3919 }}
          SORTAI_MAC_QA_FEED_3919: ${{ secrets.SORTAI_MAC_QA_FEED_3919 }}
        run: python .github/qa/macos_compact_3919.py fetch
      - name: Exercise shipped .17 compact installation and Cocoa smoke
        run: python .github/qa/macos_compact_3919.py test
